name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  SPACEHUB_COMMIT: 190777d6     # SpaceHub version used for the published results

jobs:
  test:
    name: build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib h5py pandas pytest

      - name: Fetch SpaceHub ${{ env.SPACEHUB_COMMIT }}
        run: |
          git clone --quiet https://github.com/YihanWangAstro/SpaceHub.git external/SpaceHub
          git -C external/SpaceHub checkout --quiet "$SPACEHUB_COMMIT"

      - name: Build the three-body code
        run: make -C simulation CXX=${{ matrix.os == 'macos-latest' && 'clang++' || 'g++' }}

      - name: Run tests
        run: python -m pytest -v
